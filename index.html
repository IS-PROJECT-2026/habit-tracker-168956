<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <header class="app-header">
        <p class="eyebrow">Daily focus</p>
        <h1 id="app-title">Habit Tracker</h1>
        <p class="subtitle">Build momentum one check-in at a time.</p>
      </header>

      <section class="panel" aria-label="Add habit">
        <form id="habit-form" class="habit-form" autocomplete="off">
          <label for="habit-name" class="sr-only">Habit name</label>
          <input
            id="habit-name"
            name="habitName"
            type="text"
            maxlength="80"
            placeholder="Add a habit (e.g. Read 20 minutes)"
            required
          />
          <button type="submit">Add Habit</button>
        </form>
      </section>

      <section class="panel" aria-live="polite" aria-label="Habit list">
        <ul id="habit-list" class="habit-list"></ul>
        <p id="empty-state" class="empty-state">
          No habits yet. Add your first one above.
        </p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
